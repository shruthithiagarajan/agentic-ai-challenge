[project]
name = "meridian-desk"
version = "0.1.0"
description = "Desk - Meridian Supply Co. customer-operations assistant (15 agentic AI challenges)"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "python-dotenv>=1.0", "pydantic>=2.6", "chromadb>=0.5"]

[project.scripts]
desk = "desk.cli:main"

[tool.setuptools]
packages = ["desk"]
